<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة بيت البُن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="admin-header">
    <div>
      <span class="eyebrow">بيت البُن</span>
      <h1>لوحة الإدارة</h1>
      <p>الأوردرات والرسائل واشتراكات النشرة محفوظة في SQLite.</p>
    </div>
    <div class="header-actions">
      <a href="/" target="_blank" rel="noopener">فتح الموقع</a>
      <button id="refreshButton" type="button">تحديث البيانات</button>
    </div>
  </header>

  <main>
    <section class="stats" aria-label="ملخص البيانات">
      <article><span>طلبات نشطة</span><strong id="pendingOrders">—</strong></article>
      <article><span>إجمالي الطلبات</span><strong id="totalOrders">—</strong></article>
      <article><span>الرسائل</span><strong id="messagesCount">—</strong></article>
      <article><span>المشتركون</span><strong id="subscribersCount">—</strong></article>
    </section>

    <nav class="admin-tabs" aria-label="أقسام لوحة الإدارة">
      <button class="tab active" type="button" data-tab="orders">الطلبات</button>
      <button class="tab" type="button" data-tab="messages">الرسائل</button>
      <button class="tab" type="button" data-tab="subscribers">النشرة البريدية</button>
    </nav>

    <p class="admin-status" id="adminStatus" role="status" aria-live="polite"></p>

    <section class="panel active" id="panel-orders">
      <div class="panel-head"><h2>الطلبات</h2><span>الأحدث أولًا</span></div>
      <div id="ordersList" class="orders-list"></div>
    </section>

    <section class="panel" id="panel-messages" hidden>
      <div class="panel-head"><h2>رسائل التواصل</h2><span>مرسلة من فورم الموقع</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>التاريخ</th><th>الاسم</th><th>الإيميل</th><th>الموضوع</th><th>الرسالة</th></tr></thead>
          <tbody id="messagesBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="panel-subscribers" hidden>
      <div class="panel-head"><h2>مشتركو النشرة</h2><span>العناوين المسجلة</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>التاريخ</th><th>البريد الإلكتروني</th></tr></thead>
          <tbody id="subscribersBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/admin/admin.js" defer></script>
</body>
</html>
